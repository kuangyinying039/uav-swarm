<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420">
<rect width="100%" height="100%" fill="white"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">
<text x="36" y="32" font-size="18">Physical dual capture and the lidar surrogate</text><text x="36" y="54" font-size="12" fill="#444">Success requires two Hummingbird bodies inside the 1 m sphere. A kinematic proxy inside that sphere does not end the episode and does not pay the capture bonus.</text><text x="150" y="86" text-anchor="middle" font-size="13">Top view, capture plane</text><rect x="70" y="100" width="280" height="280" fill="none" stroke="#222"/><text x="78" y="118" font-size="11" fill="#444">25 m</text><circle cx="210" cy="240" r="56" fill="none" stroke="#1F4E79" stroke-width="1.5"/><circle cx="210" cy="240" r="6" fill="#1a1a1a"/><text x="222" y="236" font-size="12">evader</text><text x="222" y="292" font-size="12" fill="#1F4E79">1.0 m sphere</text><circle cx="176" cy="214" r="7" fill="#1F4E79"/><circle cx="246" cy="228" r="7" fill="#1F4E79"/><circle cx="168" cy="292" r="7" fill="none" stroke="#1F4E79" stroke-width="1.5"/><text x="78" y="368" font-size="12">Filled: bodies inside. Open: the third pursuer still outside.</text><text x="620" y="86" text-anchor="middle" font-size="13">Side view, lidar vertical field</text><line x1="470" y1="300" x2="860" y2="300" stroke="#222"/><text x="848" y="318" font-size="11" fill="#444">horizon</text><polygon points="560,300 860,188 860,332" fill="#e8eef5" stroke="#1F4E79"/><text x="700" y="250" font-size="12">+52°</text><text x="700" y="328" font-size="12">−7°</text><text x="470" y="150" font-size="13">Horizontal field 360°. Range 0.2–12 m</text><text x="470" y="172" font-size="13">on Nominal–Hard, 11 m on Severe, 9 m on Extreme.</text><text x="470" y="194" font-size="13">Scan 10 Hz. Detection probability 0.90, 0.85, then 0.80.</text><text x="470" y="360" font-size="12" fill="#444">Livox MID-360 field of view, with a shorter range than the hardware specification.</text></g></svg>
