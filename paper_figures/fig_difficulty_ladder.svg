<text x="36" y="32" font-size="18">Difficulty ladder and where each level is used</text><text x="36" y="54" font-size="12" fill="#444">Map 25 m × 25 m, altitude 1–12 m, 3 pursuers, 1 occlusion evader, 5 buildings, 300 decisions. Training and checkpoint selection use Hard only. The other four levels are tests.</text><line x1="36" y1="88" x2="944" y2="88" stroke="#222"/><text x="36" y="96" font-size="12" font-weight="500">Level</text><text x="130" y="96" font-size="12" font-weight="500">Role</text><text x="250" y="96" font-size="12" font-weight="500">Evader speed h/v (m/s)</text><text x="430" y="96" font-size="12" font-weight="500">Start range (m)</text><text x="560" y="96" font-size="12" font-weight="500">Lidar (m)</text><text x="650" y="96" font-size="12" font-weight="500">Detect p</text><text x="740" y="96" font-size="12" font-weight="500">Footprint (m)</text><text x="860" y="96" font-size="12" font-weight="500">Height (m)</text><line x1="36" y1="106" x2="944" y2="106" stroke="#222"/><rect x="28" y="116" width="916" height="32" fill="#fafafa"/><text x="36" y="138" font-size="13">Nominal</text><text x="130" y="138" font-size="13">test only</text><text x="250" y="138" font-size="13">1.82 / 1.04</text><text x="430" y="138" font-size="13">6.0–8.0</text><text x="560" y="138" font-size="13">12</text><text x="650" y="138" font-size="13">0.90</text><text x="740" y="138" font-size="13">2.00–4.50</text><text x="860" y="138" font-size="13">3.0–10.0</text><rect x="28" y="152" width="916" height="32" fill="#fafafa"/><text x="36" y="174" font-size="13">Medium</text><text x="130" y="174" font-size="13">test only</text><text x="250" y="174" font-size="13">2.15 / 1.20</text><text x="430" y="174" font-size="13">7.5–9.5</text><text x="560" y="174" font-size="13">12</text><text x="650" y="174" font-size="13">0.85</text><text x="740" y="174" font-size="13">2.50–5.00</text><text x="860" y="174" font-size="13">4.0–11.0</text><rect x="28" y="188" width="916" height="32" fill="#f4f7fb"/><text x="36" y="210" font-size="13">Hard</text><text x="130" y="210" font-size="13">train + test</text><text x="250" y="210" font-size="13">2.35 / 1.30</text><text x="430" y="210" font-size="13">9.5–11.0</text><text x="560" y="210" font-size="13">12</text><text x="650" y="210" font-size="13">0.80</text><text x="740" y="210" font-size="13">3.00–5.50</text><text x="860" y="210" font-size="13">5.0–11.5</text><rect x="28" y="224" width="916" height="32" fill="#fafafa"/><text x="36" y="246" font-size="13">Severe</text><text x="130" y="246" font-size="13">test only</text><text x="250" y="246" font-size="13">2.48 / 1.38</text><text x="430" y="246" font-size="13">10.0–12.0</text><text x="560" y="246" font-size="13">11</text><text x="650" y="246" font-size="13">0.80</text><text x="740" y="246" font-size="13">3.25–5.75</text><text x="860" y="246" font-size="13">5.5–11.8</text><rect x="28" y="260" width="916" height="32" fill="#fafafa"/><text x="36" y="282" font-size="13">Extreme</text><text x="130" y="282" font-size="13">test only</text><text x="250" y="282" font-size="13">2.60 / 1.45</text><text x="430" y="282" font-size="13">11.0–13.0</text><text x="560" y="282" font-size="13">9</text><text x="650" y="282" font-size="13">0.80</text><text x="740" y="282" font-size="13">3.50–6.00</text><text x="860" y="282" font-size="13">6.0–12.0</text><text x="36" y="332" font-size="12" fill="#444">Shared contract: capture radius 1.0 m (twice the 0.5 m target diameter), 2 of 3 bodies inside for 1 decision, decision period 0.2 s. Pursuer limits 1.4 m/s horizontal, 0.8 m/s vertical.</text></g></svg>
